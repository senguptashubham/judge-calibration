judge_model: Qwen/Qwen2.5-7B-Instruct
dataset: lmsys/mt_bench_human_judgments

# Decision D1: compared drop_ties, count_half, mark_tie_lenient, and
# mark_tie_strict empirically on the real vote-count distribution; a "tie"
# ballot is different information from a weak preference, so ties are a
# categorical property of the item, not smoothed into frac_prefer_a - and
# "strict" (tie must strictly outnumber both sides) over "lenient" (tie only
# needs to tie for most common) because lenient discarded real signal on
# items where the tie count merely equaled the leading side's count.
# Full comparison table: PREREGISTRATION.md (task 0.10).
tie_policy: mark_tie_strict

temperature_canonical: 0.0   # sample_idx = 0, greedy, reproducible (DECISIONS.md D6)
temperature_sc: 0.7          # sample_idx = 1..k_sc (DECISIONS.md D6)
k_sc: 4

max_tokens: 512
logprobs: 20                 # top-k logprobs per token; 20, not 5 (DECISIONS.md D4)

conditions:                  # no 'swap' (D5); no 'attribution' - cut entirely (D18)
  - clean
  - verbose

prompt_variants:              # orthogonal axis, like order (D19). P1 is primary -
  - P1                        # RQ1-RQ4 use it alone. P2/P3 only exist for 'clean'.
  - P2
  - P3

seed: 1234
n_bins: 10                   # default bin count for ece()'s auto strategy (D14)

paths:
  results_dir: results
  runs_dir: runs
  figures_dir: results/figures
  calls_parquet: results/calls.parquet
  items_parquet: results/items.parquet
