[project]
name = "judge-calibration"
version = "0.1.0"
description = "Calibration and selective-evaluation study of Qwen2.5-7B-Instruct as an MT-Bench judge"
requires-python = ">=3.11"
dependencies = [
    # Pinned from the first real `pip install -e .` resolve in the judge-calib
    # conda env (2026-08-26). Only the 8 direct deps are pinned here, not the
    # transitive closure pip freeze also reported (requests, tqdm, filelock,
    # etc. come along automatically via datasets/pandas and don't need their
    # own pins) — see CLAUDE.md sec 5 and DECISIONS.md D17.
    "datasets==5.0.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    # Amended 8 Sep 2026: was pinned "==2.4.6" from whatever resolved
    # locally on 26 Aug 2026, before vllm was ever in the picture. vllm==
    # 0.28.0 transitively requires numpy<2.4 (via mistral-common), which
    # made base deps + the colab extra mutually unsatisfiable on Colab.
    # Re-pinned to 2.3.5, confirmed via `uv pip install --dry-run
    # --python-platform linux --python-version 3.11 ".[colab]"` - the
    # actual resolution for base+colab together on Colab's platform, not
    # a guess. Local env re-synced to match (was 2.4.6, now 2.3.5).
    "numpy==2.3.5",
    "scikit-learn==1.9.0",
    "matplotlib==3.11.1",
    "pyyaml==6.0.3",
    "pytest==9.1.1",
    # Added 31 Aug 2026 for the Bayesian hierarchical model (DECISIONS.md
    # D22, D24). CPU-only - jax is numpyro's own dependency, no GPU/Colab
    # extra needed since this runs as local analysis, not inference.
    "numpyro==0.21.0",
    "arviz==0.23.4",
]

[project.optional-dependencies]
# Colab only — never installed on the local dev machine (DECISIONS.md D17).
# Pinned 3 Sep 2026 per D11's task-1.2 smoke test (guided/structured decoding
# + logprobs=20 together, confirmed working on this version) - do not move
# this pin again for the rest of the project.
colab = [
    "vllm==0.28.0",
]

[tool.setuptools]
# src/ is imported as a flat package (`python -m src.data`, CLAUDE.md sec 7),
# not a src/<package_name>/ layout.
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
